name: Dependabot auto-merge

# Merget een Dependabot-PR zodra alle checks op die commit groen zijn. Een merge
# op de deploy-branch is via de Coolify-webhook meteen een productiedeploy, dus
# de checks zijn de poort.
#
# - Patch, minor en digest-updates gaan automatisch. Een major (ook één binnen
#   een groep) blijft open met een comment, die merge je zelf.
# - Branch protection en GitHub's eigen auto-merge vragen bij private repo's
#   GitHub Pro. Daarom deze workflow_run: hij draait na elke check-workflow en
#   kijkt zelf of alle checks op de head-commit klaar en groen zijn.
# - De PR-code wordt nooit uitgecheckt of uitgevoerd; alleen de API.
# - Lukt de merge niet (een bump van een workflow-bestand mag de GITHUB_TOKEN
#   soms niet mergen), dan komt er één comment en blijft de PR open.

on:
  workflow_run:
    workflows: ["validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge als alles groen is en het geen major is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "Geen PR aan deze run gekoppeld."
            exit 0
          fi

          author=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login)
          if [ "$author" != "app/dependabot" ]; then
            echo "PR #$PR is van $author, niet van Dependabot."
            exit 0
          fi

          # Wacht niet op andere workflows: die starten deze job zelf opnieuw
          # zodra ze klaar zijn. Deze job zelf telt niet mee.
          pending=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "merge") | select(.status != "completed")] | length')
          failed=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "merge") | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
          if [ "$failed" != "0" ]; then
            echo "$failed check(s) niet groen; PR #$PR blijft open."
            exit 0
          fi
          if [ "$pending" != "0" ]; then
            echo "$pending check(s) lopen nog; de laatste start deze job opnieuw."
            exit 0
          fi

          # Dependabot zet per dependency een update-type in de commit message.
          if gh api "repos/$REPO/commits/$SHA" --jq .commit.message \
               | grep -q 'update-type: version-update:semver-major'; then
            marker="<!-- dependabot-auto-merge:major -->"
            if ! gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n%s' "$marker" "Checks zijn groen, maar dit is een major-update. Die merget de workflow niet automatisch: kijk de changelog na en merge zelf.")"
            fi
            echo "Major-update; PR #$PR blijft open."
            exit 0
          fi

          if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"; then
            echo "PR #$PR gemerged."
          else
            marker="<!-- dependabot-auto-merge:failed -->"
            if ! gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n%s' "$marker" "Checks zijn groen, maar de automatische merge lukte niet (een wijziging aan een workflow-bestand mag de GITHUB_TOKEN niet altijd mergen). Merge hem zelf: \`gh pr merge $PR --squash --delete-branch\`.")"
            fi
            exit 1
          fi
